<div>
  <!--<samp ></samp>-->
  <div>
    <button [ngModel] (click)="getProduct()">Get the prodacts</button>
  </div>

  <div>
    <div class="prod" *ngFor="let item of Posts">
      <div>
        <h1 class="name" style="right: 50px">{{ item.PRDname }}</h1>
        <h1>מחיר : ₪{{ item.PRDPrice }}</h1>
        <img src="{{ item.PRDImage }}" width="300" height="200" />
        <h3>category:{{ item.PRDCategory }}</h3>
        <br />
        <h3>contein:{{ item.PRDTitle }}</h3>
        <br />

        <button #adbotton type="submit" [ngModel] (click)="add_to_busket(item)">
          add to busket
        </button>
      </div>
    </div>
  </div>
</div>
